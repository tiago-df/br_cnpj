# BR CNPJ → POI Pipeline — Non-sensitive configuration
# Secrets (API keys, credentials) go in .env — not here.

source:
  base_url: "https://dados-abertos-rf-cnpj.casadosdados.com.br"

paths:
  input_dir: "data/input"
  intermediate_dir: "data/intermediate"
  cache_dir: "data/cache"
  output_dir: "data/output"
  log_dir: "logs"

filters:
  situacao_ativa: "02"
  excluir_porte_mei: "05"        # MEI size code
  excluir_natureza_mei: "2135"   # MEI legal nature code

duckdb:
  threads: 0           # 0 = all available cores
  memory_limit: "24GB" # leave headroom on 32 GB machine

download:
  workers: 4
  chunk_size_mb: 8
  retry_attempts: 3
  retry_backoff_seconds: 5

output:
  parquet_compression: "zstd"
  parquet_row_group_size: 122880  # ~128 k rows
  csv_compression: "gzip"

file:
  encoding: "windows-1252-2000"   # ICU name accepted by DuckDB (RF files are Windows-1252)
  delimiter: ";"

geocoding:
  # Phase A — BrasilAPI CEP lookup (https://brasilapi.com.br)
  # Free, no auth. Results cached to data/cache/cep_brasilapi.parquet.
  cep_workers: 20                 # concurrent async HTTP requests to BrasilAPI

  # Phase B — City-centre detection via geobr municipality centroids
  # A POI geocoded from CEP is flagged "municipio_centroid" (low precision)
  # if it falls within this radius of the municipality centroid.
  city_center_threshold_m: 500    # metres

  # Phase C — TomTom Structured Geocode API fallback
  # Requires TOMTOM_API_KEY set in .env. Results cached per dump date.
  # Set tomtom_enabled: false to skip this phase entirely.
  tomtom_enabled: true
  tomtom_workers: 10              # concurrent async requests to TomTom API
